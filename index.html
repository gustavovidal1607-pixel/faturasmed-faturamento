<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faturas Med - Faturamento</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="tela-login">
  <div class="login-caixa">
    <img class="logo-img logo-img-login" src="img/logo.png" alt="Faturas Med">
    <div class="tagline">Controle de Faturamento</div>
    <div class="erro-login" id="erro-login"></div>
    <input type="text" id="login-usuario" placeholder="Usuário" autocomplete="username">
    <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">
    <button class="btn" id="btn-login">Entrar</button>
  </div>
</div>

<div id="app" hidden>
  <header class="topo">
    <img class="logo-img" src="img/logo.png" alt="Faturas Med">
    <nav class="abas" id="nav-abas"></nav>
    <div class="usuario-info">
      <div>
        <div class="nome" id="usuario-nome"></div>
        <div class="papel" id="usuario-papel"></div>
      </div>
      <button class="btn secundario pequeno" id="btn-sair">Sair</button>
    </div>
  </header>
  <div class="corpo">
    <aside class="barra-lembretes" id="barra-lembretes"></aside>
    <main id="conteudo"></main>
  </div>
</div>

<div id="modal-fundo" class="modal-fundo" hidden>
  <div class="modal-caixa" id="modal-conteudo"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
